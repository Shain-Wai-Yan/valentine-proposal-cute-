<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffb6d9 0%, #ffc9e3 50%, #ffe0ec 100%);
            animation: bgPulse 4s ease-in-out infinite;
            padding: 20px;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.3);
            max-width: 550px;
            width: 100%;
            border: 3px solid #ffb6d9;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px !important;
            }

            .subtitle {
                font-size: 14px !important;
            }

            .gif-container {
                min-height: 220px !important;
            }

            .message {
                font-size: 18px !important;
            }

            button {
                padding: 12px 30px !important;
                font-size: 14px !important;
            }

            #yesBtn {
                min-width: 100px !important;
            }

            #noBtn {
                min-width: 100px !important;
            }
        }

        .header-heart {
            font-size: 60px;
            margin-bottom: 15px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
        }

        h1 {
            color: #ff4081;
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.2);
        }

        .subtitle {
            color: #ff6ba6;
            font-size: 16px;
            margin-bottom: 25px;
            font-style: italic;
        }

        .gif-container {
            margin: 30px 0;
            min-height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe8f5 0%, #fff0f7 100%);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .gif-container::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="3" fill="%23ffb6d9" opacity="0.3"/><circle cx="80" cy="80" r="2" fill="%23ffc9e3" opacity="0.3"/></svg>');
            pointer-events: none;
        }

        .sticker-wrapper {
            width: 160px;
            height: 160px;
            z-index: 1;
            filter: drop-shadow(0 4px 8px rgba(255, 107, 157, 0.2));
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .sticker-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .sticker-wrapper {
                width: 140px;
                height: 140px;
            }
        }

        .message {
            font-size: 20px;
            color: #ff4081;
            margin: 20px 0;
            min-height: 40px;
            font-weight: 600;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 35px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff4081 0%, #f50057 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
            min-width: 130px;
        }

        #yesBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(255, 64, 129, 0.6);
        }

        #yesBtn:active {
            transform: scale(0.98);
        }

        #noBtn {
            background: linear-gradient(135deg, #ffb6d9 0%, #ffc9e3 100%);
            color: #ff4081;
            border: 2px solid #ff4081;
            font-weight: 700;
            min-width: 130px;
        }

        #noBtn:hover {
            background: linear-gradient(135deg, #ffa3c7 0%, #ffb6d9 100%);
        }

        /* Success State */
        .main-content {
            display: block;
        }

        .success-container {
            display: none;
        }

        .success-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .success-gif-box {
            min-height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe8f5 0%, #fff0f7 100%);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
        }

        .success-sticker-wrapper {
            width: 200px;
            height: 200px;
            animation: celebration 0.6s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-sticker-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @keyframes celebration {
            0% { transform: scale(0) rotate(-30deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .success-message {
            font-size: 26px;
            color: #ff4081;
            font-weight: 700;
            line-height: 1.4;
        }

        .sparkle {
            display: inline-block;
            animation: sparkle 0.6s ease;
            font-size: 28px;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .decorative-stickers {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .sticker {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .sticker:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .sticker:nth-child(2) { top: 20%; right: 8%; animation-delay: 1s; }
        .sticker:nth-child(3) { top: 60%; left: 3%; animation-delay: 2s; }
        .sticker:nth-child(4) { top: 70%; right: 5%; animation-delay: 1.5s; }
        .sticker:nth-child(5) { bottom: 10%; left: 10%; animation-delay: 2.5s; }
    </style>
</head>
<body>
    <div class="decorative-stickers">
        <div class="sticker">💕</div>
        <div class="sticker">✨</div>
        <div class="sticker">💘</div>
        <div class="sticker">🌸</div>
        <div class="sticker">💫</div>
    </div>

    <div class="container">
        <div class="header-heart">💕✨💕</div>
        <h1>Will you be my Valentine?</h1>
        <p class="subtitle">Please say yes...</p>
        
        <div class="main-content" id="mainContent">
            <div class="gif-container">
                <div class="sticker-wrapper" id="stickerWrapper">
                    <img class="sticker-img" id="stickerImg" src="https://media.giphy.com/media/aiAYc1ulnN4dBKl2yz/giphy.gif" alt="Cute sticker">
                </div>
            </div>

            <div class="message" id="message">
                Pretty please? 💫
            </div>

            <div class="buttons">
                <button id="yesBtn">Yes! 💕</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div class="success-container" id="successContainer">
            <div class="success-content">
                <div class="success-gif-box">
                    <div class="success-sticker-wrapper">
                        <img class="success-sticker-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWRsd2JqaDRjdHlwa2d0eW50Yzh0Y3Fuenk4YXdhMzR5MzRmOWhzNiZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/QigYdnKB0BL0dvh9Xu/giphy.gif" alt="Celebration sticker">
                    </div>
                </div>
                <div class="success-message" id="successMessage">
                    <span class="sparkle">✨</span><br>
                    Yay! I love you!<br>
                    <span class="sparkle">✨</span><br>
                    You just made me the happiest! 💕
                </div>
            </div>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const messageEl = document.getElementById('message');
        const stickerImg = document.getElementById('stickerImg');
        const stickerWrapper = document.getElementById('stickerWrapper');
        const buttonsContainer = document.querySelector('.buttons');
        const mainContent = document.getElementById('mainContent');
        const successContainer = document.getElementById('successContainer');

        let noClickCount = 0;

        const messages = [
            "Are you sure? 🥺",
            "Really really sure? 😭",
            "Just think about it... 💭",
            "Say yes! Please! 💕",
            "Don't break my heart 😢",
            "C'mon, you know you want to! 💫",
            "Please please PLEASE? 🙏",
            "I'm not giving up on us! 💪",
            "One more chance? 🥹",
            "JUST SAY YES ALREADY! 😭💕"
        ];

        // Animated GIF stickers in order
        const stickerExpressions = [
            // 1. First convincing - Cute pleading
            "https://media.giphy.com/media/aiAYc1ulnN4dBKl2yz/giphy.gif",
            
            // 2. Second convincing - More pleading
            "https://media.giphy.com/media/bKyQb654tHDq72daXJ/giphy.gif",
            
            // 3. Third convincing - Crying/desperate
            "https://media.giphy.com/media/z2xeqcoqsJIvBkm0gv/giphy.gif",
            
            // 4. Fourth - Heartbroken/sad
            "https://media.giphy.com/media/5ouxQsY5V5as4UwpRo/giphy.gif",
            
            // 5. Last before yes - Final plea
            "https://media.giphy.com/media/sfIpPNDj8yLodyVxDh/giphy.gif",
        ];

        noBtn.addEventListener('click', function(e) {
            noClickCount++;

            // Change message with animation
            messageEl.style.animation = 'none';
            setTimeout(() => {
                messageEl.style.animation = 'fadeIn 0.5s ease';
            }, 10);

            if (noClickCount <= messages.length) {
                messageEl.textContent = messages[noClickCount - 1];
            }

            // Change sticker GIF - load first one on first click
            const stickerIndex = Math.min(noClickCount - 1, stickerExpressions.length - 1);
            stickerImg.src = stickerExpressions[stickerIndex];

            // Grow yes button significantly
            yesBtn.style.padding = `${14 + noClickCount * 4}px ${40 + noClickCount * 8}px`;
            yesBtn.style.fontSize = `${16 + noClickCount * 2}px`;

            // Shrink no button - BUT ONLY START MOVING AFTER ALL GIFS SHOWN (after 5 clicks)
            if (noClickCount < stickerExpressions.length) {
                // Before all GIFs shown - just shrink slightly, don't move
                const scale = Math.max(0.5, 1 - (noClickCount * 0.08));
                const opacity = Math.max(0.5, 1 - (noClickCount * 0.08));
                noBtn.style.opacity = opacity;
                noBtn.style.transform = `scale(${scale})`;
            } else {
                // After all GIFs shown - start making it run away
                const scale = Math.max(0.2, 0.6 - ((noClickCount - stickerExpressions.length) * 0.12));
                const opacity = Math.max(0.2, 0.6 - ((noClickCount - stickerExpressions.length) * 0.12));
                noBtn.style.opacity = opacity;
                noBtn.style.transform = `scale(${scale})`;
            }

            // Add pulse to yes button
            yesBtn.style.animation = 'none';
            setTimeout(() => {
                yesBtn.style.animation = 'heartbeat 0.4s ease';
            }, 10);
        });

        yesBtn.addEventListener('click', function() {
            // Hide main content
            mainContent.style.display = 'none';

            // Show success with celebration
            successContainer.style.display = 'block';

            // Confetti celebration
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.5 }
            });

            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 120,
                    origin: { y: 0.5 }
                });
            }, 300);

            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    spread: 100,
                    origin: { y: 0.5 }
                });
            }, 600);
        });

        // Make no button try to escape on mobile/touch
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            noBtn.click();
        });

        // Make no button move away from mouse (kicks in ONLY after all GIFs shown)
        document.addEventListener('mousemove', function(e) {
            if (noClickCount > stickerExpressions.length && noBtn.style.display !== 'none') {
                const noBtnRect = noBtn.getBoundingClientRect();
                const noBtnCenterX = noBtnRect.left + noBtnRect.width / 2;
                const noBtnCenterY = noBtnRect.top + noBtnRect.height / 2;
                
                const distance = Math.sqrt(
                    Math.pow(e.clientX - noBtnCenterX, 2) + 
                    Math.pow(e.clientY - noBtnCenterY, 2)
                );

                if (distance < 150) {
                    const angle = Math.atan2(noBtnCenterY - e.clientY, noBtnCenterX - e.clientX);
                    const moveDistance = 100;
                    const newX = noBtnCenterX + Math.cos(angle) * moveDistance;
                    const newY = noBtnCenterY + Math.sin(angle) * moveDistance;
                    
                    noBtn.style.position = 'fixed';
                    noBtn.style.left = Math.max(10, Math.min(window.innerWidth - noBtnRect.width - 10, newX)) + 'px';
                    noBtn.style.top = Math.max(10, Math.min(window.innerHeight - noBtnRect.height - 10, newY)) + 'px';
                }
            }
        });
    </script>
</body>
</html>
